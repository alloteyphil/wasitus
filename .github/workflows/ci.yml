# CI: checks every pull request and every push to main.
#
# A workflow is a YAML file in .github/workflows/. It says WHEN to run (`on`)
# and WHAT to run (`jobs`). Jobs run in parallel, each on a fresh virtual
# machine (a "runner"). The steps inside one job run in order on that machine.
# A walkthrough of everything used here: docs/CI_CD.md
name: ci

on:
  push:
    branches: [main]
  pull_request:
  # Also weekly, so a newly published vulnerability or a broken dependency
  # shows up even in a week with no pushes.
  schedule:
    - cron: "0 6 * * 1" # Mondays 06:00 UTC

# Every run gets a GITHUB_TOKEN. Here it may only read the repo; a job that
# needs more asks for it explicitly (see release.yml).
permissions:
  contents: read

# A new push to a pull request cancels its run that is still in progress.
# Runs on main are never cancelled, so every commit on main gets a result
# (and the weekly run cannot cancel a push run, or the other way round).
concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  checks:
    name: format, tidy, vet, build
    runs-on: ubuntu-latest
    steps:
      # `uses` runs an Action: a reusable step someone published. `@v7` pins
      # the major version.
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7 # also caches downloaded modules and builds
        with:
          go-version-file: go.mod
      # `run` runs shell commands. A non-zero exit code fails the step.
      # Capture first, so the step also fails if gofmt itself fails.
      - name: Check formatting
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then echo "$unformatted"; exit 1; fi
      - name: Check go.mod is tidy
        run: go mod tidy -diff
      - run: go vet ./...
      - run: go build -o /dev/null ./cmd/wasitus

  test:
    # A matrix runs the same job once per value: here three machines at once.
    strategy:
      fail-fast: false # let every OS finish, so one failure can't hide another
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      # `if` decides whether a step runs. The race detector needs a C compiler
      # on Windows, so Windows runs the tests without it. -shuffle=on runs
      # tests in a random order, which exposes tests that depend on each other.
      - name: Test (race detector)
        if: runner.os != 'Windows'
        run: go test -race -shuffle=on -count=1 -coverprofile=coverage.out ./...
      - name: Test
        if: runner.os == 'Windows'
        run: go test -shuffle=on -count=1 ./...
      # Text appended to $GITHUB_STEP_SUMMARY appears on the run's summary page.
      - name: Coverage summary
        if: runner.os == 'Linux'
        run: |
          {
            echo '### Test coverage'
            echo '```'
            go tool cover -func=coverage.out | tail -1
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      # The same script `make check` uses, so local and CI agree.
      - name: Coverage floor (85%)
        if: runner.os == 'Linux'
        run: scripts/coverage-floor.sh coverage.out 85
      # An artifact is a file kept after the runner is thrown away. Download it
      # from the run's summary page.
      - name: Upload coverage report
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage.out
          retention-days: 7

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.15.0

  demo:
    name: demo lab (tidy, vet, test, lint)
    runs-on: ubuntu-latest
    # The lab is its own Go module (docs/adr/0006-demo-separate-module.md), so
    # `go test ./...` at the root skips it. `defaults` runs every `run` step
    # in this job from demo/.
    defaults:
      run:
        working-directory: demo
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: demo/go.mod
      - run: go mod tidy -diff
      - run: go vet ./...
      - run: go test -race -shuffle=on -count=1 -timeout 2m ./...
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.15.0
          working-directory: demo

  workflows:
    name: lint workflows
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      # Workflows are code too: actionlint catches typos, bad expressions and
      # shell mistakes in these YAML files.
      - run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12

  release-dry-run:
    name: release dry run
    # `needs` makes this job wait until these jobs have passed.
    needs: [checks, test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # full history and tags; GoReleaser reads them
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      # Builds every release binary exactly like release.yml, but publishes
      # nothing (--snapshot). A broken release config shows up here, on the
      # pull request, instead of on release day.
      - uses: goreleaser/goreleaser-action@v7
        with:
          version: "~> v2"
          args: release --snapshot --clean
      - name: Upload binaries
        uses: actions/upload-artifact@v7
        with:
          name: binaries
          path: |
            dist/*.tar.gz
            dist/*.zip
          retention-days: 7

  vulncheck:
    name: known vulnerabilities
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      # govulncheck reports only vulnerabilities in code the program actually
      # calls, in our dependencies or in the Go standard library.
      - name: govulncheck (tool)
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...
      - name: govulncheck (demo lab)
        working-directory: demo
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...

  # One check that sums up all the others. Branch protection requires only
  # this one, so adding or renaming a job can never weaken the rule.
  ci-ok:
    name: ci ok
    # always(): without it, this job is SKIPPED when a job it needs fails,
    # and GitHub treats a skipped required check as passing.
    if: always()
    needs: [checks, test, lint, demo, workflows, release-dry-run, vulncheck]
    runs-on: ubuntu-latest
    steps:
      - name: Every job passed
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Job results: $RESULTS"
          for r in $RESULTS; do
            if [ "$r" != "success" ]; then
              echo "::error::A required job did not succeed ($r)"
              exit 1
            fi
          done
