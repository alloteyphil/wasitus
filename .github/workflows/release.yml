# CD: publishes a GitHub Release when a version tag is pushed.
#
#   git tag v0.1.0
#   git push origin v0.1.0
#
# GoReleaser (configured in .goreleaser.yaml) builds wasitus for macOS, Linux
# and Windows, writes checksums and release notes from the commit messages,
# and attaches everything to the release.
name: release

on:
  push:
    tags: ["v*"]

# Least privilege: nothing by default...
permissions: {}

jobs:
  release:
    runs-on: ubuntu-latest
    # ...and only this job may write, because creating a release and
    # uploading files to it is a write to the repo.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # release notes are built from the history since the last tag
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      # Never publish something that fails its own tests.
      - run: go test -race -count=1 ./...
      - uses: goreleaser/goreleaser-action@v7
        with:
          version: "~> v2"
          args: release --clean
        env:
          # Created automatically for each run and expires when the run ends.
          # No secret needs to be added to the repo settings.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
