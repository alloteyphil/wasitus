# Example wasitus config. Copy it to wasitus.yaml and edit.
# Secrets never go in this file: they are read from the environment variables
# named below.

timezone: Africa/Accra   # used to read and show times; storage is always UTC
lookback: 60m            # also collect this long before --from

sources:
  changes_file: changes.yaml   # manual notes; relative to this file

  # Coming in M2:
  # signoz:
  #   url: http://localhost:8080
  #   api_key_env: SIGNOZ_API_KEY

  # GitHub: merged pull requests, deployments and releases in the window
  # become change events. Commented out so this example runs offline (the
  # tests run it); uncomment it to read real repositories. The token must be a
  # read-only, fine-grained token with Pull requests, Deployments and Contents
  # (for releases) set to read. If the variable is missing or empty, wasitus
  # stops with an error instead of calling GitHub without it.
  # github:
  #   token_env: GITHUB_TOKEN    # name of the variable, never the token itself
  #   repos: [alloteyphil/wasitus]

services:                      # repository -> telemetry service name
  alloteyphil/wasitus: orders-service
